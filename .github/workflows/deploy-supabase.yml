name: Deploy Supabase

# Déploie le backend Noteflix (migrations + Edge Functions) sur le projet Supabase.
# Tourne sur les runners GitHub (qui peuvent joindre Supabase).
#
# Secrets repo requis (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  : un Personal Access Token Supabase (sbp_...)
#                            (Dashboard → Account → Access Tokens)
#   SUPABASE_PROJECT_ID    : chelxvoflmrjzkwndxts
#   SUPABASE_DB_PASSWORD   : le mot de passe de la base (défini à la création du projet)
#   ANTHROPIC_API_KEY      : (optionnel) pour activer les fonctions IA — sinon mode gratuit

on:
  workflow_dispatch:
    inputs:
      set_anthropic:
        description: "Poser aussi le secret ANTHROPIC_API_KEY (nécessite le secret repo)"
        type: boolean
        default: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Apply migrations (db push)
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          for fn in index-item search recommend generate-path backfill summarize; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_ID"
            echo "::endgroup::"
          done

      - name: (Optionnel) Set ANTHROPIC_API_KEY secret
        if: ${{ inputs.set_anthropic }}
        run: supabase secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" --project-ref "$PROJECT_ID"

      - name: Done
        run: echo "Déploiement terminé. Mode IA = ${{ inputs.set_anthropic && 'activé' || 'gratuit (sans Claude)' }}."
