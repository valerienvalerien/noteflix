project_id = "noteflix"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "noteflix://"
additional_redirect_urls = ["noteflix://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Mettre à false en dev local pour se connecter sans confirmer l'e-mail.
enable_confirmations = false

# Les Edge Functions vérifient le JWT de l'appelant (RLS côté serveur).
[functions.index-item]
verify_jwt = true

[functions.search]
verify_jwt = true

[functions.recommend]
verify_jwt = true

[functions.generate-path]
verify_jwt = true

[edge_runtime]
enabled = true
